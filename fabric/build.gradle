plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.63'
    id 'com.communi-suggestu.obumbratio' version '0.0.4'
}

platform {
    fabric {
        loaderVersion = "0.16.7"
        apiVersion = "0.114.0"
        accessWideners = rootProject.file("common/accesswidener.accesswidener")
    }
}

tableau {
    project {
        group = "mod.chiselsandbits"
        publisher = "chisels-and-bits"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('chisels-and-bits-chisels-and-bits')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}

shaders {
    enable()
    sodium()
    fabric()
}

dependencies {
    modImplementation "com.communi-suggestu.saecularia-caudices:fabric:${project.property('communi.suggestu.saecularia.caudices.version')}"
    include "com.communi-suggestu.saecularia-caudices:fabric:${project.property('communi.suggestu.saecularia.caudices.version')}"

    modImplementation "com.communi-suggestu.scena:fabric:${project.property('communi.suggestu.scena.version')}"
    include "com.communi-suggestu.scena:fabric:${project.property('communi.suggestu.scena.version')}"
}